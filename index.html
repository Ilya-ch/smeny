  if(ds.date){if(ui.brush)paint(ds.date);else openDay(ds.date);return}
  if(ds.brush){ui.brush=ui.brush===ds.brush?null:ds.brush;render();return}
  if(ds.view&&!ds.act){ui.view=ds.view;ui.brush=null;saveUI();render();window.scrollTo(0,0);return}
  if(ds.month){ui.m=+ds.month;ui.mode='month';saveUI();render();return}
  if(ds.cmp){const s=new Set(ui.cmp);s.has(ds.cmp)?s.delete(ds.cmp):s.add(ds.cmp);ui.cmp=[...s];if(!ui.cmp.length)ui.cmp=[ds.cmp];saveUI();render();return}
  if(ds.cmpday){const[c,d]=ds.cmpday.split('|');ui.cal=c;saveUI();render();openDay(d);return}
  if(ds.pm!==undefined){ui.y=pickY;ui.m=+ds.pm;closeSheet();render();return}
  if(ds.taxpre){draft.taxRate=ds.taxpre;refreshSheet();return}
  if(ds.dcolor){draft.color=ds.dcolor;refreshSheet();return}
  if(ds.demoji){draft.emoji=ds.demoji;refreshSheet();return}
  if(ds.step!==undefined){draft.seq.splice(+ds.step,1);refreshSheet();return}
  if(ds.addstep!==undefined){draft.seq.push(ds.addstep||null);refreshSheet();return}
  const a=ds.act,id=ds.id;
  switch(a){
    case 'close':closeSheet();break;
    case 'payList':payListOpen(ds.v,ds.scope);break;
    case 'plAll':pl.all=ds.v==='1';refreshSheet();break;
    case 'togglePaid':{const e=S.entries[id];if(!e)break;snap();setPaid(e,!e.paid);persist();render();refreshSheet();break}
    case 'setPaid':{const e=S.entries[id];if(!e)break;const v=ds.v==='1';if(!!e.paid===v)break;snap();setPaid(e,v);persist();render();refreshSheet();break}
    case 'payAll':{const[a,b]=plRange(),td=todayStr(),cs=pl.scope==='stat'?scopeCals():[ui.cal];const l=live('entries').filter(e=>cs.includes(e.cal)&&e.date>=a&&e.date<=b&&e.date<=td&&!e.paid&&(tyOf(e)||{}).kind==='work');snap();l.forEach(e=>setPaid(e,true));persist();render();refreshSheet();toast(`Оплачено: ${l.length} ${plural(l.length,'смена','смены','смен')}`);break}
    case 'prev':ui.mode==='year'&&ui.view==='cal'?(ui.y--,render()):shiftMonth(-1);break;
    case 'next':ui.mode==='year'&&ui.view==='cal'?(ui.y++,render()):shiftMonth(1);break;
    case 'prevY':ui.y--;render();break;
    case 'nextY':ui.y++;render();break;
    case 'today':ui.y=new Date().getFullYear();ui.m=new Date().getMonth();render();break;
    case 'undo':if(undoApply()){persist();render();refreshSheet();toast('Возвращено')}break;
    case 'mode':ui.mode=ds.v;ui.brush=null;saveUI();render();break;
    case 'sp':ui.statPeriod=ds.v;saveUI();render();break;
    case 'scope':ui.statScope=ds.v;saveUI();render();break;
    case 'pickCal':pickCal();break;
    case 'useCalStat':ui.cal=id;ui.statScope='cal';saveUI();render();break;
    case 'useCal':ui.cal=id;saveUI();closeSheet();render();break;
    case 'pickMonth':pickMonth();break;
    case 'pmY':pickY+=+ds.v;refreshSheet();break;
    case 'toggleHol':{snap();const cur=isHol(ui.day);put('days',{id:ui.day,holiday:!cur});persist();render();refreshSheet();break}
    case 'openEnt':ui.open=ui.open===id?null:id;refreshSheet();break;
    case 'addEnt':{snap();const e=newEntry(ui.cal,ui.day,ds.type);ui.open=null;persist();render();refreshSheet();break}
    case 'delEnt':{const e=S.entries[id],t=e&&tyOf(e);snap();remove('entries',id);if(ui.open===id)ui.open=null;persist();render();refreshSheet();toast(`Удалено: ${t?t.name:'смена'}`,true);break}
    case 'clearDay':{const l=dayList(ui.cal,ui.day);if(!l.length)break;snap();l.forEach(e=>remove('entries',e.id));ui.open=null;persist();render();refreshSheet();toast(`Удалено смен: ${l.length}`,true);break}
    case 'addEv':{const inp=$('#evIn'),v=inp&&inp.value.trim();if(!v)break;snap();put('events',{id:uid(),cal:ui.cal,date:ui.day,title:v});persist();render();refreshSheet();break}
    case 'delEv':snap();remove('events',id);persist();render();refreshSheet();break;
    case 'typeEdit':typeEdit(id,ds.kind);break;
    case 'typeSave':{const d=draft;if(!d.name.trim()){toast('Введите название');break}snap();const{_new,...o}=d;o.code=(o.code||o.name).trim().slice(0,3);o.taxRate=o.taxRate===''||o.taxRate==null?'':num(o.taxRate);for(const k of ['breakMin','rate','fixedPay','shiftRate','hourRate','agreedH','otPct','otRound','otMin','taxiFix','foodFix'])if(o[k]!==undefined)o[k]=num(o[k]);put('types',o);persist();closeSheet();render();break}
    case 'typeDel':{const n=live('entries').filter(e=>e.type===draft.id).length;if(draft.kind==='work'&&types().filter(t=>t.kind==='work').length<2){toast('Нужна хотя бы одна компания');break}const dd=draft;askConfirm(dd.kind==='work'?'Удалить компанию?':'Удалить тип?',n?`Вместе с «${dd.name}» удалятся ${n} ${plural(n,'смена','смены','смен')}. Отменить можно кнопкой ↶.`:`«${dd.name}» пропадёт из списка.`,'Удалить',()=>{snap();live('entries').filter(e=>e.type===dd.id).forEach(e=>remove('entries',e.id));remove('types',dd.id);persist();render()});break}
    case 'calEdit':calEdit(id);break;
    case 'calSave':{const d=draft;if(!d.name.trim()){toast('Введите название');break}snap();const{_new,...o}=d;put('calendars',o);if(_new){ui.cal=o.id;saveUI()}persist();closeSheet();render();break}
    case 'calDel':{if(cals().length<2){toast('Это единственный календарь');break}const n=live('entries').filter(e=>e.cal===draft.id).length;const dd=draft;askConfirm('Удалить календарь?',`«${dd.name}»${n?` и ${n} ${plural(n,'смена','смены','смен')} в нём`:''} пропадут на всех устройствах. Отменить можно кнопкой ↶.`,'Удалить',()=>{snap();live('entries').filter(e=>e.cal===dd.id).forEach(e=>remove('entries',e.id));remove('calendars',dd.id);if(ui.cal===dd.id){ui.cal=(cals()[0]||{}).id;saveUI()}persist();render()});break}
    case 'goalEdit':goalEdit(id);break;
    case 'goalSave':{snap();const{_new,...o}=draft;o.target=num(o.target);put('goals',o);persist();closeSheet();render();break}
    case 'goalDel':snap();remove('goals',draft.id);persist();closeSheet();render();break;
    case 'patEdit':patEdit(id);break;
    case 'patSave':{const d=draft;snap();const{_new,...o}=d;o.name=o.name.trim()||`Цикл ${o.seq.length} дн.`;put('patterns',o);persist();if(ap)ap.pid=o.id;closeSheet();render();break}
    case 'patDel':snap();remove('patterns',draft.id);persist();closeSheet();render();break;
    case 'patternSheet':patternSheet();break;
    case 'apApply':{const p=allPatterns().find(x=>x.id===ap.pid);if(!p)break;if(p.seq.some(s=>TOKENS[s])&&!S.types[ap.co]){toast('Сначала добавьте компанию');break}snap();const n=applyPattern(p,ui.cal,ap.start,apEnd(),ap.mode,ap.co);persist();closeSheet();ui.brush=null;render();toast(`Расставлено: ${n} ${plural(n,'смена','смены','смен')}`);break}
    case 'printMonth':printMonth();break;
    case 'exportJson':download(`smeny-${todayStr()}.json`,JSON.stringify(S,null,1),'application/json');break;
    case 'importJson':$('#fileIn').click();break;
    case 'exportIcs':download(`smeny-${curCal().name.replace(/[^\wа-яё-]+/gi,'_')}.ics`,icsFor(ui.cal),'text/calendar');toast('Откройте файл, чтобы добавить смены в календарь');break;
    case 'resetAll':askConfirm('Удалить все данные?','Смены, календари, компании и настройки удалятся на всех устройствах. Сначала лучше сохранить копию.','Удалить всё',()=>{snap();const t=now();for(const c of COLLS)for(const k in S[c])S[c][k]={id:k,del:true,u:t};const d=defaults();for(const k in d.types)put('types',d.types[k]);put('calendars',d.calendars.c1);S.settings={...d.settings,u:t};ui.cal='c1';persist();render();toast('Данные удалены')});break;
    case 'syConnect':syConnect();break;
    case 'syncNow':syncNow(false);break;
    case 'syOff':askConfirm('Отключить синхронизацию?','На этом устройстве удалятся токен и ключ. Данные останутся здесь и в облаке; включить можно снова той же фразой.','Отключить',()=>{sync={token:'',gist:'',key:'',salt:'',auto:true,last:0,msg:'',err:false};saveSync();render()});break;
    case 'pinSet':lockState.mode='set1';lockState.buf='';lockState.first='';renderLock();break;
    case 'pinCancel':$('#lock').hidden=true;break;
    case 'pinOff':askConfirm('Выключить код?','Приложение будет открываться без кода на этом устройстве.','Выключить',()=>{try{localStorage.removeItem(LOCKKEY)}catch(e){}render()});break;
    case 'lockNow':showLock();break;
    case 'pinForgot':lockForgot();break;
    case 'pinBack':showLock();break;
    case 'pinWipe':{try{for(const k of Object.keys(localStorage))if(k.startsWith('smeny.'))localStorage.removeItem(k)}catch(e){}location.reload();break}
    case 'cfYes':{const f=CONFIRM_FN;CONFIRM_FN=null;closeSheet();if(f)f();break}
  }
});
document.addEventListener('change',ev=>{
  const el=ev.target,ds=el.dataset;
  if(ds.set){let v=el.value;if(el.type==='number'||ds.num)v=num(v);setS(ds.set,v);persist();if(ds.rr)render();return}
  if(ds.efb){const e=S.entries[ds.id];if(!e)return;snap();if(el.checked)e[ds.efb]=true;else delete e[ds.efb];put('entries',e);persist();render();refreshSheet();return}
  if(ds.syncb){sync[ds.syncb]=el.checked;saveSync();return}
  if(ds.lockafter){const L=lsGet(LOCKKEY);if(L){L.after=num(el.value);lsSet(LOCKKEY,L)}return}
  if(ds.setb){setS(ds.setb,el.checked);persist();return}
  if(ds.ui){ui[ds.ui]=el.value;saveUI();if(ds.ui==='theme')applyTheme();render();return}
  if(ds.ef){
    const e=S.entries[ds.id];if(!e)return;snap();let v=el.value;
    if(['br','pay','bonus','expense','taxi','food'].includes(ds.ef))v=v===''?'':num(v);
    if(v===''||v==null)delete e[ds.ef];else e[ds.ef]=v;
    if(ds.ef==='type'){const nt=S.types[v];if(nt&&nt.start&&nt.end){e.s=nt.start;e.e=nt.end;e.br=num(nt.breakMin)}}
    put('entries',e);persist();render();refreshSheet();return;
  }
  if(ds.note!==undefined){const k=ui.cal+'|'+ds.note;snap();put('notes',{id:k,text:el.value});persist();render();return}
  if(ds.ap){ap[ds.ap]=el.value;refreshSheet();return}
  if(ds.d){draft[ds.d]=el.value;if(ds.d==='color'||ds.d==='kind'||ds.rf)refreshSheet();return}
  if(el.id==='fileIn'&&el.files[0]){
    const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o.v||!o.types)throw 0;snap();S=merge(S,o);persist();render();toast('Копия загружена и объединена с текущими данными')}catch(e){toast('Это не файл копии «Смен»')}};r.readAsText(el.files[0]);el.value='';
  }
});
document.addEventListener('input',ev=>{const ds=ev.target.dataset;if(ds.d&&ds.d!=='color'&&ds.d!=='kind')draft[ds.d]=ev.target.value});
document.addEventListener('keydown',ev=>{
  if(!$('#lock').hidden){if(/^[0-9]$/.test(ev.key))pinPress(ev.key);else if(ev.key==='Backspace')pinPress('del');else if(ev.key==='Enter')pinPress('ok');return}
  if(ev.key==='Escape'){if($('#sheet').classList.contains('open'))closeSheet();else if(ui.brush){ui.brush=null;render()}}
  if(ev.key==='Enter'&&ev.target.id==='evIn')document.querySelector('[data-act=addEv]').click();
  if((ev.metaKey||ev.ctrlKey)&&ev.key==='z'&&!/INPUT|TEXTAREA/.test(ev.target.tagName)){ev.preventDefault();if(undoApply()){persist();render();refreshSheet()}}
});
$('#scrim').addEventListener('click',closeSheet);
/* swipe months */
let tx=null,ty=null;
document.addEventListener('touchstart',e=>{if(!e.target.closest('#view'))return;const t=e.touches[0];tx=t.clientX;ty=t.clientY},{passive:true});
document.addEventListener('touchend',e=>{if(tx==null)return;const t=e.changedTouches[0],dx=t.clientX-tx,dy=t.clientY-ty;tx=null;if(Math.abs(dx)>70&&Math.abs(dy)<45&&(ui.view==='cal'||ui.view==='cmp'||(ui.view==='stat'&&ui.statPeriod==='month'))){if(ui.view==='cal'&&ui.mode==='year'){ui.y+=dx<0?1:-1;render()}else shiftMonth(dx<0?1:-1)}},{passive:true});
document.addEventListener('visibilitychange',()=>{
  const L=lsGet(LOCKKEY);
  if(document.visibilityState==='hidden'){lockState.hiddenAt=now();return}
  if(L&&L.hash&&!isLocked()&&lockState.hiddenAt&&now()-lockState.hiddenAt>=num(L.after)*60000){showLock();return}
  if(!isLocked()){render();scheduleFlush(300);scheduleSync(300)}
});
window.addEventListener('online',()=>{scheduleFlush(0);scheduleSync(0)});

/* ===== boot ===== */
(function boot(){
  reindex();applyTheme();
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme);
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  if(!lsGet(KEY))lsSet(KEY,S);
  const L=lsGet(LOCKKEY);
  if(L&&L.hash&&!INFRAME)showLock();
  render();checkGoals();
  cloudInit();
  if(!(L&&L.hash))scheduleSync(500);
})();

</script>
</body>
</html>
